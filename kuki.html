<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Journey Kuku ✈️</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9ecf, #8fd3ff);
      color: white;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      padding: 30px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 300;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .emoji {
      font-size: 2.2rem;
      margin-bottom: 10px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .btn {
      background: linear-gradient(45deg, #ff4da6, #4da6ff);
      border: none;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1rem; }
      p { font-size: 0.9rem; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="emoji">✈️💖💙</div>
    <h1>Happy Journey Kuku!</h1>
    <h2>Bon Voyage to the US 🇺🇸</h2>
    <p>
      Wishing you a safe flight, exciting adventures, and unforgettable memories 💕💙<br>
      May this journey bring you happiness, growth, and lots of smiles!
    </p>

    <button class="btn" onclick="launchConfetti()">Send Love 💗💙</button>
  </div>

  <script>
    function launchConfetti() {
      let duration = 2000;
      let end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 60,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 60,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // Auto trigger on load
    window.onload = launchConfetti;
  </script>

</body>
</html>
